name: turb-gpt

services:
  app:
    build: .
    image: turb-gpt:latest
    container_name: turb-gpt-app
    restart: unless-stopped
    # 默认只绑本机回环:用 SSH 隧道访问,不暴露公网。
    # 确需公网访问时改为 "5000:5000",并务必设置强 WEBUI_AUTH_CODE。
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      # 部署目录整体挂载为 /app:代码、turb.sqlite3、日志、缓存都在宿主机,
      # git push 更新代码后 docker compose restart 即可,无需重建镜像
      - .:/app
    environment:
      TZ: Asia/Shanghai
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5000/login', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
